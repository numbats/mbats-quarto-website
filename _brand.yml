meta:
  name: MBAts

color:
  palette:
    # Taken from the MBAT Club logo
    navy: "#0F2F96"
    blue: "#2F5BD0"
    skyblue: "#ABCBEE"
    cream: "#F5F3E3"

    black: "#1B2340"
    gray: "#E6E8F0"
    white: "#ffffff"

    # Sticker accents (sun, tree, tulip)
    yellow: "#F2B53A"
    green: "#7A9A4A"
    red: "#D9483B"
    orange: "#E8693F"

  background: cream
  foreground: black
  primary: navy
  secondary: skyblue
  tertiary: blue

  light: cream
  dark: navy
  success: green 
  warning: red
  danger: red

